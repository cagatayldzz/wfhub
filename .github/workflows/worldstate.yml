# Fetches the game state of every platform and pushes it to the WFHub API (the game's server refuses Cloudflare Workers).
# Needs the repository secret WORLDSTATE_PUSH_TOKEN, the same value as the Worker's secret of that name.
name: World state

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: worldstate
  cancel-in-progress: true

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/push-worldstate.sh
          sparse-checkout-cone-mode: false
      - run: bash scripts/push-worldstate.sh
        env:
          WORLDSTATE_PUSH_TOKEN: ${{ secrets.WORLDSTATE_PUSH_TOKEN }}
