[package]
name = "wfhub-worker"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
wfhub-api = { path = "..", default-features = false }
serde_json = "1"
base64 = "0.22"
worker = { version = "0.8", features = ["d1"] }

[lints.rust]
unsafe_code = "deny"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
