[workspace]
resolver = "2"
members = ["apps/wfhub", "apps/wfhub-web/api", "crates/core", "crates/ffi"]
default-members = ["apps/wfhub"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.dependencies]
gpui = { package = "gpui-fast", version = "0.1.14" }
gpui-platform = { package = "gpui-fast-platform", version = "0.1.14", features = ["runtime_shaders", "wayland", "x11"] }
wfhub-core = { path = "crates/core" }
